<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janevera's Birthday Memories</title>
    <!-- Premium Fonts: Poppins for clean readable text, Dancing Script for elegant headings -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff758c;
            --text-dark: #2d3436;
            --glass-bg: rgba(255, 255, 255, 0.3);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Premium Animated Mesh Gradient - Warm and magical */
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            perspective: 1200px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient Glowing Orbs (Bokeh) instead of flat clouds */
        .bokeh-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .bokeh {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            animation: floatBokeh linear infinite;
            opacity: 0.5;
        }

        @keyframes floatBokeh {
            0% { transform: translateY(120vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        /* Glassmorphism Reusable Class for a premium look */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: var(--glass-shadow);
            padding: 50px 40px;
            text-align: center;
            z-index: 10;
            max-width: 90%;
        }

        /* Elegant Typography */
        h1.cursive-title {
            font-family: 'Dancing Script', cursive;
            font-size: 5.5rem;
            background: linear-gradient(to right, #ff4757, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            line-height: 1.2;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.05));
        }

        h2.subtitle {
            font-size: 1.3rem;
            font-weight: 400;
            color: #4a4e69;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Screen Transitions */
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* Start Button */
        .btn-start {
            padding: 18px 55px;
            font-size: 1.2rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 117, 140, 0.3);
            transition: all 0.3s ease;
        }

        .btn-start:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(255, 117, 140, 0.5);
        }

        /* Game Area */
        #game-screen {
            z-index: 5;
        }
        
        .instruction {
            position: absolute;
            top: 8%;
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 15;
            animation: gentleFloat 4s infinite ease-in-out;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Realistic Shiny Balloons */
        .balloon-container {
            position: absolute;
            bottom: -200px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatBalloon linear infinite;
        }

        @keyframes floatBalloon {
            0% { transform: translateY(0) translateX(0) rotate(-3deg); }
            33% { transform: translateY(-40vh) translateX(30px) rotate(3deg); }
            66% { transform: translateY(-80vh) translateX(-20px) rotate(-3deg); }
            100% { transform: translateY(-130vh) translateX(15px) rotate(3deg); }
        }

        .balloon {
            width: 95px;
            height: 120px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            /* Make it look like shiny latex */
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.15), 0 15px 25px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Specular Highlight */
        .balloon::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 45px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            top: 15px;
            left: 20px;
            transform: rotate(40deg);
            filter: blur(1px);
        }

        /* Balloon Tie */
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 12px solid inherit;
        }
        
        .string {
            width: 1.5px;
            height: 75px;
            background: rgba(255,255,255,0.7);
            margin-top: 8px;
            position: relative;
            transform-origin: top;
            animation: swayString 3s infinite ease-in-out alternate;
        }

        @keyframes swayString {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(8deg); }
        }

        .balloon-container:hover .balloon {
            transform: scale(1.1);
        }

        /* 3D Polaroid Modal */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .polaroid {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.4), 0 0 100px rgba(255,255,255,0.1);
            transform: rotateY(90deg) scale(0.8) translateZ(-200px);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
            width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .overlay.active .polaroid {
            transform: rotateY(0deg) scale(1) rotate(-1deg) translateZ(0);
        }

        .polaroid-img {
            width: 100%;
            height: auto;
            max-height: 40vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            background: #f8f9fa;
        }

        .polaroid-caption {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            font-size: 1.15rem;
            color: #4a4e69;
            line-height: 1.6;
            margin-bottom: 30px;
            font-style: italic;
        }

        .btn-continue {
            position: relative;
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            color: #2d3436;
            border: none;
            border-radius: 40px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(161, 196, 253, 0.4);
            transition: all 0.2s;
        }
        
        .btn-continue:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 20px rgba(161, 196, 253, 0.6);
        }

        /* Grand Finale Screen */
        .final-glass {
            max-width: 750px;
            width: 90%;
            padding: 60px 40px;
        }

        .final-cake {
            font-size: 7rem;
            margin-bottom: 10px;
            animation: gentleFloat 3s infinite ease-in-out;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
        }

        .final-message {
            font-size: 1.25rem;
            line-height: 1.8;
            font-weight: 400;
            color: #2f3542;
            margin-top: 15px;
        }

        .date-badge {
            display: inline-block;
            margin-top: 35px;
            padding: 10px 25px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #ff4757;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(255, 154, 158, 0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Orbs -->
    <div class="bokeh-container" id="bokeh-container"></div>

    <!-- 1. Start Screen -->
    <div id="start-screen" class="screen">
        <div class="glass-card">
            <h1 class="cursive-title">Hey Janevera!</h1>
            <h2 class="subtitle">Ready for a magical trip down memory lane?</h2>
            <button class="btn-start" onclick="startGame()">Start 🎈</button>
        </div>
    </div>

    <!-- 2. Interactive Game Screen -->
    <div id="game-screen" class="screen hidden">
        <h1 class="instruction">Pop the balloons!</h1>
        <div id="balloons-container"></div>
    </div>

    <!-- 3. Final Celebration Screen -->
    <div id="final-screen" class="screen hidden">
        <div class="glass-card final-glass">
            <div class="final-cake">🎂</div>
            <h1 class="cursive-title">Happy Birthday!</h1>
            <h2 class="subtitle" style="font-size: 1.8rem; font-weight: 600; margin-bottom: 15px; color: #ff6b81;">Janevera Appiah</h2>
            <div class="final-message">
                Every memory we've caught today is a testament to how wonderful you are. 
                Wishing you a day as brilliant, playful, and unforgettable as you! 💖
                <br>
                <div class="date-badge">November 1st</div>
            </div>
        </div>
    </div>

    <!-- 3D Polaroid Modal Reveal -->
    <div class="overlay" id="memory-overlay">
        <div class="polaroid">
            <img class="polaroid-img" id="memory-img" src="" alt="Memory">
            <div class="polaroid-caption" id="memory-text">Memory text...</div>
            <button class="btn-continue" onclick="continueGame()">Catch More</button>
        </div>
    </div>

    <script>
        // Generate glowing orbs (bokeh)
        const bokehContainer = document.getElementById('bokeh-container');
        for (let i = 0; i < 15; i++) {
            const orb = document.createElement('div');
            orb.classList.add('bokeh');
            
            const size = 50 + Math.random() * 150;
            orb.style.width = `${size}px`;
            orb.style.height = `${size}px`;
            orb.style.left = `${Math.random() * 100}%`;
            
            orb.style.animationDuration = `${15 + Math.random() * 20}s`;
            orb.style.animationDelay = `-${Math.random() * 20}s`; 
            
            bokehContainer.appendChild(orb);
        }

        const memories = [
            { 
                icon: '📸', 
                text: "That time we laughed until we couldn't breathe!", 
                img: "./IMG-20241101-WA0005.jpg",
                color: "linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)" // Pink gradient
            },
            { 
                icon: '🌟', 
                text: "The moments that shaped our beautiful bond.", 
                img: "./IMG-20241101-WA0007.jpg",
                color: "linear-gradient(135deg, #f6d365 0%, #fda085 100%)" // Yellow/Orange
            },
            { 
                icon: '😂', 
                text: "Your help is leading me to find myself again, and after leaving your presence it seems I am always injected with laughing gas!", 
                img: "./IMG-20241101-WA0016.jpg",
                color: "linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%)" // White/Silver
            },
            { 
                icon: '🎉', 
                text: "Celebrating every little victory together.", 
                img: "./IMG-20251102-WA0001.jpg",
                color: "linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)" // Blue
            },
            { 
                icon: '💖', 
                text: "Always there for each other, through thick and thin.", 
                img: "./IMG-20251102-WA0002.jpg",
                color: "linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)" // Peach
            },
            { 
                icon: '🌺', 
                text: "Your smile always brightens up the darkest days.", 
                img: "./IMG-20251102-WA0004.jpg",
                color: "linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)" // Green
            },
            { 
                icon: '🎶', 
                text: "So many inside jokes, so little time!", 
                img: "./IMG-20251102-WA0005.jpg",
                color: "linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)" // Purple/Blue
            },
            { 
                icon: '🥂', 
                text: "And the countless memories still waiting to be made!", 
                img: "./Screenshot_20231009-001529.png",
                color: "linear-gradient(135deg, #fccb90 0%, #d57eeb 100%)" // Sunset
            },
            { 
                icon: '✨', 
                text: "Can't help but smile when looking at this.", 
                img: "./IMG-20241103-WA0024.jpg",
                color: "linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)" // Aqua
            },
            { 
                icon: '🥰', 
                text: "I cherish every single second spent with you.", 
                img: "./Screenshot_20231014-061103.png",
                color: "linear-gradient(135deg, #ffc3a0 0%, #ffafbd 100%)" // Rose
            },
            { 
                icon: '🌈', 
                text: "You are simply the best!", 
                img: "./Screenshot_20240331-192918.png",
                color: "linear-gradient(135deg, #fccb90 0%, #d57eeb 100%)" 
            },
            { 
                icon: '💕', 
                text: "Cheers to many more adventures!", 
                img: "./Screenshot_20240526-134038~2.jpg",
                color: "linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)" // Lavender
            }
        ];

        let caughtCount = 0;
        let activeBalloons = [];

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.8 }, zIndex: 100 });
            
            spawnBalloons();
        }

        function spawnBalloons() {
            const container = document.getElementById('balloons-container');
            
            memories.forEach((mem, index) => {
                const wrapper = document.createElement('div');
                wrapper.classList.add('balloon-container');
                
                const balloon = document.createElement('div');
                balloon.classList.add('balloon');
                balloon.style.background = mem.color;
                balloon.innerHTML = mem.icon;
                
                const style = document.createElement('style');
                const bId = `b-${index}`;
                balloon.id = bId;
                // Extracting a solid color approximation for the balloon tie from the gradient
                style.innerHTML = `#${bId}::after { border-bottom-color: rgba(255,255,255,0.4); }`;
                document.head.appendChild(style);

                const string = document.createElement('div');
                string.classList.add('string');
                
                wrapper.appendChild(balloon);
                wrapper.appendChild(string);
                
                wrapper.style.left = `${10 + Math.random() * 80}%`;
                
                const duration = 14 + Math.random() * 10;
                wrapper.style.animationDuration = `${duration}s`;
                wrapper.style.animationDelay = `${Math.random() * 8}s`;
                
                wrapper.onclick = () => catchBalloon(wrapper, index);
                
                wrapper.addEventListener('animationiteration', () => {
                    wrapper.style.left = `${10 + Math.random() * 80}%`;
                });

                container.appendChild(wrapper);
                activeBalloons.push(wrapper);
            });
        }

        function catchBalloon(wrapper, index) {
            wrapper.style.pointerEvents = 'none'; 
            
            wrapper.children[0].style.transform = 'scale(1.6)';
            wrapper.children[0].style.opacity = '0';
            wrapper.children[1].style.opacity = '0'; 
            
            const rect = wrapper.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            confetti({
                particleCount: 60,
                spread: 70,
                origin: { x, y },
                colors: ['#ff9a9e', '#fecfef', '#ffffff'] // Soft colors to match theme
            });

            setTimeout(() => {
                wrapper.style.display = 'none'; 
                
                const overlay = document.getElementById('memory-overlay');
                document.getElementById('memory-text').innerText = memories[index].text;
                document.getElementById('memory-img').src = memories[index].img;
                
                overlay.classList.add('active');
            }, 350);

            caughtCount++;
        }

        function continueGame() {
            const overlay = document.getElementById('memory-overlay');
            overlay.classList.remove('active');

            if (caughtCount === memories.length) {
                setTimeout(showFinalScreen, 800);
            }
        }

        function showFinalScreen() {
            document.getElementById('game-screen').classList.add('hidden');
            const finalScreen = document.getElementById('final-screen');
            finalScreen.classList.remove('hidden');
            
            const duration = 10000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 15,
                    angle: 60,
                    spread: 80,
                    origin: { x: 0 },
                    colors: ['#ff9a9e', '#fecfef', '#a1c4fd', '#FFD700']
                });
                confetti({
                    particleCount: 15,
                    angle: 120,
                    spread: 80,
                    origin: { x: 1 },
                    colors: ['#ff9a9e', '#fecfef', '#a1c4fd', '#FFD700']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                } else {
                    confetti({
                        particleCount: 250,
                        spread: 180,
                        origin: { y: 0.3 },
                        colors: ['#ff4757', '#ff9a9e', '#fecfef', '#eccc68']
                    });
                }
            }());
        }
    </script>
</body>
</html>
